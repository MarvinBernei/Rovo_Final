[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rovo-core"
version = "0.1.0"
description = "Lokaler ROVO-Kern mit sicherer Simulation und Nano-ESP32-Anbindung"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
serial = ["pyserial==3.5"]
vision = ["opencv-python-headless==4.10.0.84"]
voice = ["faster-whisper==1.1.1", "sounddevice==0.5.1", "numpy==2.1.3"]
wake = ["vosk>=0.3.45,<0.4"]
wake-trained = ["openwakeword>=0.6,<1", "onnxruntime>=1.17,<2", "numpy>=2,<3"]
ups = ["smbus2>=0.4.3,<1"]
mqtt = ["paho-mqtt>=2.1,<3"]
dev = ["ruff==0.17.1"]

[project.scripts]
rovo = "rovo.main:main"

[tool.setuptools.packages.find]
include = ["rovo*"]

[tool.setuptools.package-data]
rovo = ["catalog.json", "persona_de.md", "quiz.json"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["F", "I"]
